name: Build Android APK & LOVE Package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK & .love
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Package game.love payload
        run: |
          mkdir -p build/dist
          zip -9 -r build/dist/RetroRecompHub.love \
            main.lua \
            conf.lua \
            README.md \
            LICENSE \
            src \
            mods \
            assets \
            -x "*.git*" "*.DS_Store*" "*__pycache__*" "*.sav*" "*.gba" "*.gbc" "emulator/*"

      - name: Upload .love standalone package
        uses: actions/upload-artifact@v4
        with:
          name: RetroRecompHub-love-package
          path: build/dist/RetroRecompHub.love

      - name: Clone love-android base (v11.5a)
        run: |
          git config --global advice.detachedHead false
          git clone --depth 1 --branch 11.5a https://github.com/love2d/love-android.git android-builder
          cd android-builder
          git submodule update --init --depth 1
          cd ..
          rm -rf android-builder/.git android-builder/love/src/jni/love/.git

      - name: Inject game.love, permissions, and customize branding
        run: |
          mkdir -p android-builder/app/src/embed/assets
          cp build/dist/RetroRecompHub.love android-builder/app/src/embed/assets/game.love

          # Configure application ID and branding in gradle.properties
          sed -i 's/^app.application_id=.*/app.application_id=com.guuhferiani.retrorecomphub/' android-builder/gradle.properties
          sed -i 's/^app.name=.*/app.name=RetroRecomp Hub/' android-builder/gradle.properties
          sed -i 's/^app.orientation=.*/app.orientation=portrait/' android-builder/gradle.properties

          # Inject full storage permissions for Android 10-14+ Scoped Storage into AndroidManifest.xml
          MANIFEST="android-builder/app/src/main/AndroidManifest.xml"
          sed -i '/<manifest/a \  <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n  <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n  <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />' "$MANIFEST"
          sed -i 's/<application /<application android:requestLegacyExternalStorage="true" /' "$MANIFEST"

      - name: Inject custom app icon into Android resources
        run: |
          # Remove default adaptive icons so custom mipmap icons take effect
          rm -rf android-builder/app/src/main/res/mipmap-anydpi-v26

          # Copy pre-generated crisp launcher icons
          cp -r assets/android/* android-builder/app/src/main/res/

      - name: Build Android Debug APK
        working-directory: android-builder
        run: |
          chmod +x gradlew
          ./gradlew assembleEmbedNoRecordDebug --stacktrace

      - name: Collect and rename APK
        run: |
          mkdir -p build/apk
          cp android-builder/app/build/outputs/apk/embedNoRecord/debug/*.apk build/apk/RetroRecompHub-v1.3.0.apk
          cp build/apk/RetroRecompHub-v1.3.0.apk build/apk/RetroRecompHub-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: RetroRecompHub-Android-APK
          path: build/apk/RetroRecompHub-v1.3.0.apk

      - name: Create Official GitHub Release (v1.3.0)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: "RetroRecomp Hub v1.3.0 🚀 (Navegação Touch Fluida, Busca Rápida de ROMs & Permissões Android)"
          body: |
            ## 🎮 RetroRecomp Hub v1.3.0 — Refinamentos de Usabilidade Touch & Busca de ROMs 🚀

            Atualização dedicada à usabilidade móvel, corrigindo a navegação touch e garantindo acesso a todas as pastas de ROMs no Android!

            ### ✨ Novidades desta Versão:
            - 👆 **Navegação Touch Fluida & Gestos Naturais:**
              - Diferenciação entre toque e rolagem (swipe): agora arrastar a lista rola suavemente os itens sem disparar cliques indesejados nas pastas.
              - Deduplicação inteligente de eventos touch/mouse sintéticos (algoritmo alinhado ao Gen1Recomp oficial).
            - 🔍 **Busca Rápida de ROMs no Aparelho:**
              - Nova aba no importador que varre automaticamente pastas padrão (`Retrogame`, `Download`, `ROMs`) e lista diretamente todos os arquivos `.gba`, `.gbc`, `.bin`, `.zip`, `.sfc` encontrados no celular.
              - Destaque automático `[RECOMENDADO]` para ROMs correspondentes ao jogo atual.
            - 🛡️ **Permissões de Armazenamento Android:**
              - Declaração explícita de `MANAGE_EXTERNAL_STORAGE` e `READ_EXTERNAL_STORAGE` com suporte a armazenamento legado para ler ROMs em qualquer pasta externa no Android 10 a 14+.
            - 🎨 **Eliminação de Glifos Quebrados (`[]`):**
              - Todos os ícones foram convertidos para renderização vetorial nítida (pastas em amarelo âmbar, cartuchos em ciano/roxo, setas e botões limpos).
            - 📐 **Layout do Modal Redesenhado:**
              - Altura de toque expandida (46px) para maior conforto com o polegar.
              - Barra de rolagem visualmente indicada e rodapé em duas linhas para eliminar qualquer sobreposição com o botão de importação.

            ---
            ### 📥 Downloads:
            - **Android (APK):** Baixe e instale `RetroRecompHub-v1.3.0.apk` diretamente no seu celular Android.
            - **Universal / PC:** Execute `RetroRecompHub.love` através do LÖVE 11.5+.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build/apk/RetroRecompHub-v1.3.0.apk
            build/dist/RetroRecompHub.love

