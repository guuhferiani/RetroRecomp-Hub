name: Build Android APK & LOVE Package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK & .love
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Package game.love payload
        run: |
          mkdir -p build/dist
          zip -9 -r build/dist/RetroRecompHub.love \
            main.lua \
            conf.lua \
            README.md \
            LICENSE \
            src \
            mods \
            assets \
            -x "*.git*" "*.DS_Store*" "*__pycache__*" "*.sav*" "*.gba" "*.gbc" "emulator/*"

      - name: Upload .love standalone package
        uses: actions/upload-artifact@v4
        with:
          name: RetroRecompHub-love-package
          path: build/dist/RetroRecompHub.love

      - name: Clone love-android base (v11.5a)
        run: |
          git config --global advice.detachedHead false
          git clone --depth 1 --branch 11.5a https://github.com/love2d/love-android.git android-builder
          cd android-builder
          git submodule update --init --depth 1
          cd ..
          rm -rf android-builder/.git android-builder/love/src/jni/love/.git

      - name: Inject game.love, permissions, and customize branding
        run: |
          mkdir -p android-builder/app/src/embed/assets
          cp build/dist/RetroRecompHub.love android-builder/app/src/embed/assets/game.love

          # Configure application ID and branding in gradle.properties
          sed -i 's/^app.application_id=.*/app.application_id=com.guuhferiani.retrorecomphub/' android-builder/gradle.properties
          sed -i 's/^app.name=.*/app.name=RetroRecomp Hub/' android-builder/gradle.properties
          sed -i 's/^app.orientation=.*/app.orientation=portrait/' android-builder/gradle.properties

          # Configure storage permissions and legacy storage in AndroidManifest.xml
          MANIFEST="android-builder/app/src/main/AndroidManifest.xml"

          # Replace the restricted WRITE_EXTERNAL_STORAGE (maxSdkVersion=18) with full storage permissions
          sed -i 's|.*android\.permission\.WRITE_EXTERNAL_STORAGE.*|  <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n  <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n  <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />|' "$MANIFEST"

          # Add requestLegacyExternalStorage to <application
          sed -i 's|<application|<application android:requestLegacyExternalStorage="true"|' "$MANIFEST"

      - name: Inject custom app icon into Android resources
        run: |
          # Remove default adaptive icons so custom mipmap icons take effect
          rm -rf android-builder/app/src/main/res/mipmap-anydpi-v26

          # Copy pre-generated crisp launcher icons
          cp -r assets/android/* android-builder/app/src/main/res/

      - name: Build Android Debug APK
        working-directory: android-builder
        run: |
          chmod +x gradlew
          ./gradlew assembleEmbedNoRecordDebug --stacktrace

      - name: Collect and rename APK
        run: |
          mkdir -p build/apk
          cp android-builder/app/build/outputs/apk/embedNoRecord/debug/*.apk build/apk/RetroRecompHub-v1.3.1.apk
          cp build/apk/RetroRecompHub-v1.3.1.apk build/apk/RetroRecompHub-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: RetroRecompHub-Android-APK
          path: build/apk/RetroRecompHub-v1.3.1.apk

      - name: Create Official GitHub Release (v1.3.1)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.1
          name: "RetroRecomp Hub v1.3.1 🚀 (Correção de Toque, Importação de ROMs & Permissões Android)"
          body: |
            ## 🎮 RetroRecomp Hub v1.3.1 — Correção de Toque, Importador de ROMs & Build CI 🚀

            Atualização que corrige o build do APK Android no GitHub Actions, restaura o reconhecimento de toques na tela e aprimora a importação física de ROMs no celular!

            ### ✨ Novidades desta Versão:
            - 👆 **Correção Crítica de Toque no Android:**
              - Corrigido problema onde eventos de toque eram bloqueados antes de atingir os botões e pastas.
              - Agora o toque para navegar em pastas, selecionar ROMs e iniciar jogos responde de forma instantânea.
            - 📥 **Importação com Cópia Física para Armazenamento do Hub:**
              - Ao importar uma ROM (seja por busca, navegação ou compartilhamento de arquivo), os dados binários agora são copiados diretamente para a pasta interna do aplicativo (`roms/<platform>/`).
              - A ROM permanece segura e utilizável mesmo se os arquivos de download externos forem movidos ou alterados.
            - 📂 **Explorador Nativo Robusto via PhysFS:**
              - Listagem de pastas no Android através de montagem direta sem depender de comandos shell do sistema (`io.popen`), evitando restrições de sandbox.
            - 🛡️ **Permissões de Armazenamento Android Corrigidas:**
              - Manifesto ajustado para evitar conflitos de versão do SDK (`WRITE_EXTERNAL_STORAGE`, `READ_EXTERNAL_STORAGE` e `MANAGE_EXTERNAL_STORAGE` limpos com suporte a armazenamento legado).
            - 💾 **Pasta Pública do Hub (`externalstorage = true`):**
              - Dados e ROMs disponíveis no caminho acessível do aparelho: `Android/data/com.guuhferiani.retrorecomphub/files/save/RetroRecompHub`.

            ---
            ### 📥 Downloads:
            - **Android (APK):** Baixe e instale `RetroRecompHub-v1.3.1.apk` diretamente no seu celular Android.
            - **Universal / PC:** Execute `RetroRecompHub.love` através do LÖVE 11.5+.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build/apk/RetroRecompHub-v1.3.1.apk
            build/dist/RetroRecompHub.love

