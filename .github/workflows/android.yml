name: Build Android APK & LOVE Package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK & .love
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Package game.love payload
        run: |
          mkdir -p build/dist
          zip -9 -r build/dist/RetroRecompHub.love \
            main.lua \
            conf.lua \
            README.md \
            LICENSE \
            src \
            mods \
            assets \
            -x "*.git*" "*.DS_Store*" "*__pycache__*" "*.sav*" "*.gba" "*.gbc" "emulator/*"

      - name: Upload .love standalone package
        uses: actions/upload-artifact@v4
        with:
          name: RetroRecompHub-love-package
          path: build/dist/RetroRecompHub.love

      - name: Clone love-android base (v11.5a)
        run: |
          git clone --depth 1 --branch 11.5a --recurse-submodules --shallow-submodules \
            https://github.com/love2d/love-android.git android-builder
          rm -rf android-builder/.git android-builder/love/src/jni/love/.git

      - name: Inject game.love and customize branding
        run: |
          mkdir -p android-builder/app/src/embed/assets
          cp build/dist/RetroRecompHub.love android-builder/app/src/embed/assets/game.love

          # Configure application ID and branding in gradle.properties
          sed -i 's/^app.application_id=.*/app.application_id=com.guuhferiani.retrorecomphub/' android-builder/gradle.properties
          sed -i 's/^app.name=.*/app.name=RetroRecomp Hub/' android-builder/gradle.properties
          sed -i 's/^app.orientation=.*/app.orientation=sensorLandscape/' android-builder/gradle.properties

      - name: Inject custom app icon into Android resources
        run: |
          # Remove default adaptive icons so custom icons take effect immediately
          rm -rf android-builder/app/src/main/res/mipmap-anydpi-v26

          # Create density folders and generate launcher icons
          mkdir -p android-builder/app/src/main/res/mipmap-mdpi
          mkdir -p android-builder/app/src/main/res/mipmap-hdpi
          mkdir -p android-builder/app/src/main/res/mipmap-xhdpi
          mkdir -p android-builder/app/src/main/res/mipmap-xxhdpi
          mkdir -p android-builder/app/src/main/res/mipmap-xxxhdpi

          convert assets/icon.png -resize 48x48 android-builder/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp android-builder/app/src/main/res/mipmap-mdpi/ic_launcher.png android-builder/app/src/main/res/mipmap-mdpi/ic_launcher_round.png

          convert assets/icon.png -resize 72x72 android-builder/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp android-builder/app/src/main/res/mipmap-hdpi/ic_launcher.png android-builder/app/src/main/res/mipmap-hdpi/ic_launcher_round.png

          convert assets/icon.png -resize 96x96 android-builder/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp android-builder/app/src/main/res/mipmap-xhdpi/ic_launcher.png android-builder/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png

          convert assets/icon.png -resize 144x144 android-builder/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp android-builder/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android-builder/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png

          convert assets/icon.png -resize 192x192 android-builder/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp android-builder/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android-builder/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Build Android Debug APK
        working-directory: android-builder
        run: |
          chmod +x gradlew
          ./gradlew assembleEmbedNoRecordDebug --stacktrace

      - name: Collect and rename APK
        run: |
          mkdir -p build/apk
          cp android-builder/app/build/outputs/apk/embedNoRecord/debug/*.apk build/apk/RetroRecompHub-v1.0.0.apk
          cp build/apk/RetroRecompHub-v1.0.0.apk build/apk/RetroRecompHub-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: RetroRecompHub-Android-APK
          path: build/apk/RetroRecompHub-v1.0.0.apk

      - name: Create Official GitHub Release (v1.0.0)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "RetroRecomp Hub v1.0.0 🚀 (Multi-Console & Shaders)"
          body: |
            ## 🎮 RetroRecomp Hub v1.0.0 — Lançamento Oficial!

            Central unificada de emulação retrô e projetos recompilados, com shaders em tempo real, suporte a múltiplos consoles clássicos e experiência otimizada para PC e smartphones modernos!

            ### ✨ O que há de novo:
            - 🎨 **Novo Ícone Oficial:** Cartucho clássico com D-pad neon e trilhas holográficas.
            - 📱 **Otimização para Telas Modernas:** Layout com escala responsiva virtual e safe area para aparelhos como Samsung Galaxy S25 Ultra (19.5:9 QHD+).
            - 🕹️ **5 Plataformas Clássicas:** Game Boy, Game Boy Color, Game Boy Advance, Super Nintendo (SNES) e Sony PlayStation 1 (PS1).
            - ⚡ **Shaders em Tempo Real (`F`):** CRT Scanlines, LCD Grid Portátil, GBA Color Boost, Vignette Tube e Scale4x.
            - 💾 **Gerenciador de Saves e Mods:** Até 4 slots de gravação por jogo e suporte a mods traduzidos.

            ---
            ### 📥 Downloads:
            - **Android:** Instale o arquivo `RetroRecompHub-v1.0.0.apk` diretamente no seu celular.
            - **Universal / PC:** Execute o arquivo `RetroRecompHub.love` através do LÖVE 11.5+.
          draft: false
          prerelease: false
          files: |
            build/apk/RetroRecompHub-v1.0.0.apk
            build/dist/RetroRecompHub.love
